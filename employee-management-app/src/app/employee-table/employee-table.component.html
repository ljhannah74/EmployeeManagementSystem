<h2 class="text-center my-5">Employees</h2>
<div>
    <table class="table table-hover">
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Position</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let employee of employees">
                <td>{{ employee.id }}</td>
                <td>{{ employee.firstName }}</td>
                <td>{{ employee.lastName }}</td>
                <td>{{ employee.phone }}</td>
                <td>{{ employee.email }}</td>
                <td>{{ employee.position }}</td>
                <td>
                    <button type="button" class="btn btn-primary m-2" [disabled]="readOnlyDemo"
                        (click)="editEmployee(employee.id)">
                        Edit
                    </button>

                    <button type="button" class="btn btn-danger" [disabled]="readOnlyDemo"
                        (click)="deleteEmployee(employee.id)">
                        Delete
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
